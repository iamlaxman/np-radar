  <style>
    /* ═══════════════════════════════════════ */
    /*  PERFORMANCE & RESPONSIVE OPTIMIZATIONS */
    /* ═══════════════════════════════════════ */
    
    html { 
      scroll-behavior: smooth; 
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    
    body { 
      background: #0A0A0F; 
      font-family: 'Space Grotesk', sans-serif; 
      color: #F1F5F9; 
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* Content shift prevention */
    .page-enter { 
      animation: fadeSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Glass */
    .glass {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    
    /* Search input */
    .search-input {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.1);
      color: #F1F5F9;
      transition: border-color 0.3s, box-shadow 0.3s;
      -webkit-appearance: none;
    }
    .search-input:focus {
      outline: none;
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15), 0 0 30px rgba(99,102,241,0.2);
    }
    .search-input::placeholder { color: #475569; }
    
    /* Chip button */
    .chip-btn {
      padding: 0.375rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #CBD5E1;
      font-size: 0.8125rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .chip-btn:hover {
      background: rgba(99,102,241,0.1);
      border-color: rgba(99,102,241,0.3);
      color: #A5B4FC;
    }
    .chip-btn:active {
      transform: scale(0.95);
    }
    
    /* Tab button */
    .tab-btn {
      transition: all 0.2s ease;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active {
      color: #6366F1;
      border-bottom-color: #6366F1;
    }
    .tab-btn:not(.active):hover { color: #94A3B8; }
    
    /* Tab scroll */
    .tabs-scroll {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    
    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, #1A1A24 25%, #252535 50%, #1A1A24 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    /* Score ring */
    .score-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .score-circle {
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Data row */
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      gap: 0.75rem;
    }
    .data-row:last-child { border-bottom: none; }
    .data-key { font-size: 0.75rem; color: #64748B; flex-shrink: 0; min-width: 80px; }
    .data-val { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: #E2E8F0; text-align: right; word-break: break-all; }
    
    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-active { background: rgba(16,185,129,0.1); color: #10B981; border: 1px solid rgba(16,185,129,0.2); }
    .status-available { background: rgba(99,102,241,0.1); color: #818CF8; border: 1px solid rgba(99,102,241,0.2); }
    
    /* Mobile bottom nav */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 40;
      background: rgba(17,17,24,0.98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 6px 8px;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    .mobile-bottom-nav.visible {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .mobile-bottom-nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 8px;
      border: none; background: none;
      cursor: pointer;
      color: #64748B;
      transition: all 0.2s ease;
      min-width: 48px;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-bottom-nav button i { font-size: 15px; }
    .mobile-bottom-nav button span { font-size: 9px; font-weight: 500; letter-spacing: 0.02em; }
    .mobile-bottom-nav button.active { color: #6366F1; background: rgba(99,102,241,0.08); }
    .mobile-bottom-nav button:active { transform: scale(0.92); }
    
    /* Body padding for bottom nav */
    body.has-bottom-nav { padding-bottom: 70px; }
    
    @media (max-width: 1023px) {
      #resultsState { padding-bottom: 80px; }
    }
    
    /* Navbar */
    .nav-glass {
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .nav-shadow {
      box-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.3);
    }
    
    /* Glow */
    .glow-primary { box-shadow: 0 0 40px rgba(99,102,241,0.25); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0A0A0F; }
    ::-webkit-scrollbar-thumb { background: #1A1A24; border-radius: 2px; }
    
    /* Print styles */
    @media print {
      nav, #lookupSearch, #emptyState, #loadingState, .mobile-bottom-nav { display: none !important; }
      body { background: white; color: black; }
      .card, .glass { background: white; border: 1px solid #ddd; }
    }
  </style>
</head>

  <script>
    // ═══════════════════════════════════════
    //  PERFORMANCE & UX ENHANCEMENTS
    // ═══════════════════════════════════════
    
    // Quick lookup function
    function quickLookup(domain) {
      document.getElementById('domainInput').value = domain;
      runLookup();
    }
    
    // Share function
    function shareResult() {
      const domain = document.getElementById('domainInput')?.value || '';
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: `NP Radar — ${domain}`, text: `Domain report for ${domain}`, url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          const toast = document.createElement('div');
          toast.textContent = '✓ Link copied!';
          toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111118;color:#10B981;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;border:1px solid rgba(16,185,129,0.3);animation:fadeSlideIn 0.3s ease;';
          document.body.appendChild(toast);
          setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(() => toast.remove(),300); }, 2000);
        });
      }
    }
    
    // Search on Enter
    document.getElementById('domainInput')?.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') runLookup();
    });
    
    // Navbar shadow on scroll
    window.addEventListener('scroll', () => {
      const nav = document.getElementById('mainNav');
      if (nav) nav.classList.toggle('nav-shadow', window.scrollY > 10);
    }, { passive: true });
    
    // Bottom nav management
    const bottomNav = document.getElementById('mobileBottomNav');
    let bottomNavVisible = false;
    
    function showBottomNav() {
      if (window.innerWidth >= 1024 || bottomNavVisible) return;
      bottomNav.classList.add('visible');
      document.body.classList.add('has-bottom-nav');
      bottomNavVisible = true;
    }
    
    function hideBottomNav() {
      bottomNav.classList.remove('visible');
      document.body.classList.remove('has-bottom-nav');
      bottomNavVisible = false;
    }
    
    // Watch results state
    const resultsEl = document.getElementById('resultsState');
    if (resultsEl) {
      new MutationObserver(() => {
        resultsEl.classList.contains('hidden') ? hideBottomNav() : showBottomNav();
      }).observe(resultsEl, { attributes: true, attributeFilter: ['class'] });
    }
    
    // Handle resize
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024) {
        hideBottomNav();
      } else if (resultsEl && !resultsEl.classList.contains('hidden')) {
        showBottomNav();
      }
    });
    
    // Mobile bottom nav clicks
    document.querySelectorAll('#mobileBottomNav button[data-mobile-tab]').forEach(btn => {
      btn.addEventListener('click', function() {
        const tabName = this.dataset.mobileTab;
        const desktopTab = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
        if (desktopTab) {
          desktopTab.click();
          desktopTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          setTimeout(() => {
            const content = document.getElementById(`tab-${tabName}`);
            if (content) {
              const navH = document.getElementById('mainNav')?.offsetHeight || 56;
              window.scrollTo({ top: content.getBoundingClientRect().top + window.pageYOffset - navH - 16, behavior: 'smooth' });
            }
          }, 200);
        }
        document.querySelectorAll('#mobileBottomNav button').forEach(b => {
          b.classList.remove('active'); b.style.color = '#64748B';
        });
        this.classList.add('active'); this.style.color = '#6366F1';
      });
    });
    
    // Sync bottom nav with desktop tabs
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const tabName = this.dataset.tab;
          document.querySelectorAll('#mobileBottomNav button').forEach(b => {
            b.classList.remove('active'); b.style.color = '#64748B';
          });
          const mb = document.querySelector(`#mobileBottomNav button[data-mobile-tab="${tabName}"]`);
          if (mb) { mb.classList.add('active'); mb.style.color = '#6366F1'; }
        });
      });
      setTimeout(() => { if (resultsEl && !resultsEl.classList.contains('hidden')) showBottomNav(); }, 500);
    });
  </script>
</body>
</html>
