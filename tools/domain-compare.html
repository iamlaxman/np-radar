<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Domain Comparison — Compare Two Domains Side by Side | NP Radar</title>
  <meta name="description" content="Free domain comparison tool. Compare two domains side by side — SSL, DNS, DNSSEC, ISP, and security scores. Built for Nepal." />
  <meta name="keywords" content="domain comparison, compare domains, side by side domain check, SSL compare, DNS compare, NP Radar" />
  <meta name="theme-color" content="#8B5CF6" />
  <meta property="og:title" content="Domain Comparison — Compare Two Domains Side by Side | NP Radar" />
  <meta property="og:description" content="Compare two domains side by side — SSL, DNS, DNSSEC, ISP, and security scores." />
  <meta property="og:image" content="https://npradar.laxman-poudel.com.np/favicon/og.png" />
  
  <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{bg:'#0A0A0F',surface:'#111118',elevated:'#1A1A24',border:'rgba(255,255,255,0.08)',primary:'#6366F1',accent:'#EC4899',success:'#10B981',warning:'#F59E0B',danger:'#EF4444'},fontFamily:{display:['Syne','sans-serif'],body:['Space Grotesk','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
  
  <style>
    body { background: #0A0A0F; font-family: 'Space Grotesk', sans-serif; color: #F1F5F9; }
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .search-input { background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1); color: #F1F5F9; transition: border-color 0.3s, box-shadow 0.3s; }
    .search-input:focus { outline: none; border-color: #8B5CF6; box-shadow: 0 0 0 3px rgba(139,92,246,0.15), 0 0 30px rgba(139,92,246,0.2); }
    .search-input::placeholder { color: #475569; }
    .result-card { background: #111118; border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem; padding: 1.25rem; }
    .skeleton { background: linear-gradient(90deg, #1A1A24 25%, #252535 50%, #1A1A24 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    .chip-btn { padding: 0.375rem 0.75rem; border-radius: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #CBD5E1; font-size: 0.8125rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.2s ease; }
    .chip-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(139,92,246,0.3); color: #8B5CF6; }
  </style>
</head>
<body>

  <nav class="sticky top-0 z-50 flex items-center justify-between px-4 md:px-6 py-3 border-b border-white/5" style="background:rgba(10,10,15,0.95);backdrop-filter:blur(12px)">
    <a href="../index.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm">
      <i class="fas fa-arrow-left text-xs"></i> Home
    </a>
    <div class="flex items-center gap-2">
      <img src="../favicon/favicon-32x32.png" alt="NP Radar" class="w-6 h-6 rounded" />
      <span class="font-display font-bold text-sm">NP <span class="text-primary">Radar</span></span>
    </div>
    <a href="tools.html" class="flex items-center gap-1 text-slate-400 hover:text-white transition-colors text-sm">
      <i class="fas fa-th-large text-xs"></i> Tools
    </a>
  </nav>

  <div style="max-width:900px;margin:0 auto;padding:30px 20px">

    <div class="mb-8">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.2)">
          <i class="fas fa-code-compare text-violet-400 text-lg"></i>
        </div>
        <div>
          <h1 class="font-display text-2xl md:text-3xl font-bold">Domain Comparison</h1>
          <p class="text-slate-400 text-sm">Compare two domains side by side — SSL, DNS, DNSSEC, ISP, and more.</p>
        </div>
      </div>
    </div>

    <div class="glass rounded-2xl p-3 mb-6">
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="domain1" placeholder="First domain..." class="flex-1 px-4 py-3.5 rounded-xl text-base search-input" autocomplete="off" spellcheck="false" />
        <input type="text" id="domain2" placeholder="Second domain..." class="flex-1 px-4 py-3.5 rounded-xl text-base search-input" autocomplete="off" spellcheck="false" />
        <button onclick="compare()" class="px-6 py-3.5 rounded-xl font-semibold text-white transition-all hover:scale-105 active:scale-95 whitespace-nowrap flex items-center justify-center gap-2" style="background:#8B5CF6">
          <i class="fas fa-code-compare"></i> Compare
        </button>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 mb-6">
      <span class="text-slate-500 text-xs">Quick:</span>
      <button onclick="quickCompare('ncell.com.np', 'ntc.net.np')" class="chip-btn">ncell vs ntc</button>
      <button onclick="quickCompare('ku.edu.np', 'tu.edu.np')" class="chip-btn">ku vs tu</button>
      <button onclick="quickCompare('worldlink.com.np', 'vianet.com.np')" class="chip-btn">worldlink vs vianet</button>
    </div>

    <div id="emptyState" class="text-center py-16">
      <div class="text-5xl mb-5 text-slate-700"><i class="fas fa-code-compare"></i></div>
      <h2 class="font-display text-xl font-bold mb-2">Enter two domains to compare</h2>
      <p class="text-slate-400 max-w-md mx-auto text-sm">Compare SSL, DNS records, DNSSEC status, ISP, and security scores side by side.</p>
    </div>

    <div id="loading" class="hidden"><div class="skeleton h-20 rounded-xl mb-4"></div><div class="skeleton h-20 rounded-xl mb-4"></div></div>
    <div id="error" class="hidden text-center py-12"><div class="text-4xl mb-4 text-slate-600"><i class="fas fa-exclamation-circle"></i></div><p id="errorMsg" class="text-slate-400"></p></div>
    <div id="results" class="hidden"></div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    
    function quickCompare(d1, d2) { document.getElementById('domain1').value = d1; document.getElementById('domain2').value = d2; compare(); }
    
    async function compare() {
      const d1 = document.getElementById('domain1').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      const d2 = document.getElementById('domain2').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      if(!d1||!d2) return;
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
      try {
        const r = await fetch(`${API}/api/compare?domain1=${encodeURIComponent(d1)}&domain2=${encodeURIComponent(d2)}`);
        const d = await r.json();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results').classList.remove('hidden');
        const renderDomain = (info, label, color) => `
          <div class="result-card flex-1">
            <div class="text-sm font-bold mb-3" style="color:${color}">${label}</div>
            <div class="font-mono text-sm text-slate-300 mb-4 truncate">${info.domain}</div>
            <div class="space-y-2 text-sm">
              <div class="flex justify-between py-1.5 border-b border-white/5"><span class="text-slate-500">IP Address</span><span class="font-mono text-slate-300">${info.dns?.a||'N/A'}</span></div>
              <div class="flex justify-between py-1.5 border-b border-white/5"><span class="text-slate-500">Nameservers</span><span class="font-mono text-slate-300">${(info.dns?.ns||[]).length||0} NS</span></div>
              <div class="flex justify-between py-1.5 border-b border-white/5"><span class="text-slate-500">SSL</span><span class="font-semibold ${info.ssl?.valid?'text-success':'text-danger'}">${info.ssl?.valid?'✅ Valid':'❌ Invalid'}</span></div>
              <div class="flex justify-between py-1.5 border-b border-white/5"><span class="text-slate-500">SSL Expires</span><span class="font-mono text-slate-300">${info.ssl?.daysLeft||'N/A'} days</span></div>
              <div class="flex justify-between py-1.5"><span class="text-slate-500">DNSSEC</span><span class="font-semibold ${info.dnssec?'text-success':'text-danger'}">${info.dnssec?'✅ Enabled':'❌ Disabled'}</span></div>
            </div>
          </div>`;
        document.getElementById('results').innerHTML = `<div class="flex flex-col md:flex-row gap-4">${renderDomain(d.domain1,'Domain 1','#8B5CF6')}${renderDomain(d.domain2,'Domain 2','#06B6D4')}</div>`;
      } catch(e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = e.message || 'Failed to compare. Please try again.';
      }
    }
  </script>
</body>
</html>
