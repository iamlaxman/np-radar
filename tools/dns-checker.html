  <script>tailwind.config={theme:{extend:{colors:{bg:'#0A0A0F',surface:'#111118',elevated:'#1A1A24',border:'rgba(255,255,255,0.08)',primary:'#6366F1',accent:'#EC4899',success:'#10B981',warning:'#F59E0B',danger:'#EF4444'},fontFamily:{display:['Syne','sans-serif'],body:['Space Grotesk','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
  
  <style>
    body { background: #0A0A0F; font-family: 'Space Grotesk', sans-serif; color: #F1F5F9; }
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .search-input { background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1); color: #F1F5F9; transition: border-color 0.3s, box-shadow 0.3s; }
    .search-input:focus { outline: none; border-color: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15), 0 0 30px rgba(16,185,129,0.2); }
    .search-input::placeholder { color: #475569; }
    .result-card { background: #111118; border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem; padding: 1.25rem; }
    .skeleton { background: linear-gradient(90deg, #1A1A24 25%, #252535 50%, #1A1A24 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    .chip-btn { padding: 0.375rem 0.75rem; border-radius: 0.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #CBD5E1; font-size: 0.8125rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; }
    .chip-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(16,185,129,0.3); color: #10B981; }
    .grade-circle { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 3rem; }
  </style>
</head>
<body>

  <nav class="sticky top-0 z-50 flex items-center justify-between px-4 md:px-6 py-3 border-b border-white/5" style="background:rgba(10,10,15,0.95);backdrop-filter:blur(12px)">
    <a href="../index.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm">
      <i class="fas fa-arrow-left text-xs"></i> Home
    </a>
    <div class="flex items-center gap-2">
      <img src="../favicon/favicon-32x32.png" alt="NP Radar" class="w-6 h-6 rounded" />
      <span class="font-display font-bold text-sm">NP <span class="text-primary">Radar</span></span>
    </div>
    <a href="tools.html" class="flex items-center gap-1 text-slate-400 hover:text-white transition-colors text-sm">
      <i class="fas fa-th-large text-xs"></i> Tools
    </a>
  </nav>

  <div style="max-width:900px;margin:0 auto;padding:30px 20px">

    <div class="mb-8">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2)">
          <i class="fas fa-clipboard-check text-emerald-400 text-lg"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-display text-2xl md:text-3xl font-bold">DNS Configuration Checker</h1>
          <p class="text-slate-400 text-sm">Grade your DNS setup with a comprehensive report.</p>
        </div>
      </div>
    </div>

    <div class="glass rounded-2xl p-3 mb-6">
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="flex-1 relative">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          <input type="text" id="domainInput" placeholder="Enter domain — e.g. ncell.com.np" class="w-full pl-11 pr-4 py-3.5 rounded-xl text-base search-input" autocomplete="off" spellcheck="false" />
        </div>
        <button onclick="check()" class="px-6 py-3.5 rounded-xl font-semibold text-white transition-all hover:scale-105 active:scale-95 whitespace-nowrap flex items-center justify-center gap-2" style="background:#10B981">
          <i class="fas fa-clipboard-check"></i> Check DNS
        </button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2 mb-6">
      <span class="text-slate-500 text-xs flex-shrink-0 font-medium">Quick:</span>
      <button onclick="quickCheck('ncell.com.np')" class="chip-btn">ncell.com.np</button>
      <button onclick="quickCheck('ku.edu.np')" class="chip-btn">ku.edu.np</button>
      <button onclick="quickCheck('laxman-poudel.com.np')" class="chip-btn">laxman-poudel.com.np</button>
      <button onclick="quickCheck('google.com')" class="chip-btn">google.com</button>
    </div>

    <div id="emptyState" class="text-center py-16">
      <div class="text-5xl mb-5 text-slate-700"><i class="fas fa-clipboard-check"></i></div>
      <h2 class="font-display text-xl font-bold mb-2">Enter a domain to check DNS configuration</h2>
      <p class="text-slate-400 max-w-md mx-auto text-sm">Get a complete DNS grade — SPF, DMARC, DKIM, DNSSEC, IPv6, nameservers, and more.</p>
    </div>

    <div id="loading" class="hidden"><div class="skeleton h-20 rounded-xl mb-4"></div><div class="skeleton h-20 rounded-xl mb-4"></div></div>
    <div id="error" class="hidden text-center py-12"><div class="text-4xl mb-4 text-slate-600"><i class="fas fa-exclamation-circle"></i></div><p id="errorMsg" class="text-slate-400"></p></div>
    <div id="results" class="hidden"></div>
  </div>

  <script>
    const API = window.location.origin;
    
    function quickCheck(domain) { document.getElementById('domainInput').value = domain; check(); }
    
    async function check() {
      const domain = document.getElementById('domainInput').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      if(!domain) return;
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
      try {
        const r = await fetch(`${API}/api/dns-check?domain=${encodeURIComponent(domain)}`);
        const d = await r.json();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results').classList.remove('hidden');
        document.getElementById('results').innerHTML = `
          <div class="result-card mb-4 text-center">
            <div class="text-xs text-slate-500 uppercase tracking-wider mb-3">DNS Grade</div>
            <div class="grade-circle mx-auto mb-3" style="background:${d.gradeColor}15;border:3px solid ${d.gradeColor}30;color:${d.gradeColor}">${d.grade}</div>
            <div class="text-lg font-semibold">${d.percentage}% — ${d.totalScore}/${d.maxScore} points</div>
            <div class="text-slate-500 text-sm mt-1">${d.grade === 'A' ? 'Excellent!' : d.grade === 'B' ? 'Good, but room for improvement.' : d.grade === 'C' ? 'Average — needs attention.' : d.grade === 'D' ? 'Below average — multiple issues.' : 'Critical issues found.'}</div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            ${Object.entries(d.checks||{}).map(([k,c])=>`
              <div class="result-card flex items-start gap-3">
                <div class="text-xl flex-shrink-0 ${c.passed?'text-success':'text-danger'}">${c.passed?'<i class="fas fa-check-circle"></i>':'<i class="fas fa-times-circle"></i>'}</div>
                <div><div class="font-medium text-sm">${c.name}</div><div class="text-xs text-slate-500 mt-0.5">${c.detail||''}</div></div>
                <div class="ml-auto text-xs font-mono text-slate-600">${c.score}pts</div>
              </div>
            `).join('')}
          </div>
          ${d.recommendations?.length?`<div class="result-card"><div class="text-xs text-warning uppercase tracking-wider mb-3">Recommendations</div>${d.recommendations.map(r=>`<div class="text-sm text-slate-400 py-1.5 border-b border-white/5 last:border-0">• ${r}</div>`).join('')}</div>`:''}
        `;
      } catch(e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = e.message || 'Failed to check DNS. Please try again.';
      }
    }
    document.getElementById('domainInput').addEventListener('keydown', e => { if(e.key==='Enter') check(); });
  </script>
</body>
</html>
